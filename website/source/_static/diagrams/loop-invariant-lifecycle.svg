<svg xmlns="http://www.w3.org/2000/svg" width="100%" aria-labelledby="li-title" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 720 240"><title id="li-title">Loop invariant: establishment, preservation, exit</title><defs><marker id="li-arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#64748b" d="M0,0 L7,3 L0,6 Z"/></marker></defs><style>text{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif}.step{font-size:13px;fill:#334155}.step-title{font-size:14px;font-weight:700}.tag{font-size:12px;font-weight:600;fill:#16a34a}</style><rect width="160" height="144" x="32" y="48" fill="#eff6ff" stroke="#3b6fd9" stroke-width="2" rx="10"/><text x="112" y="80" fill="#1e40af" class="step-title" text-anchor="middle">Entry</text><text x="112" y="108" class="step" text-anchor="middle">Invariant I</text><text x="112" y="128" class="step" text-anchor="middle">must hold</text><text x="112" y="168" class="tag" text-anchor="middle">establishment</text><rect width="224" height="144" x="248" y="48" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" rx="10"/><text x="360" y="72" class="tag" text-anchor="middle">preservation</text><text x="360" y="100" fill="#312e81" class="step-title" text-anchor="middle">One iteration</text><text x="360" y="124" class="step" text-anchor="middle">Assume I and cond</text><text x="360" y="144" class="step" text-anchor="middle">Run body; prove I again</text><rect width="160" height="144" x="528" y="48" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="10"/><text x="608" y="80" fill="#14532d" class="step-title" text-anchor="middle">Exit</text><text x="608" y="108" class="step" text-anchor="middle">I and not cond</text><text x="608" y="128" class="step" text-anchor="middle">useful fact</text><text x="608" y="168" class="tag" text-anchor="middle">exit condition</text><path stroke="#64748b" stroke-width="2" marker-end="url(#li-arrow)" d="M192 120 H248"/><path stroke="#64748b" stroke-width="2" marker-end="url(#li-arrow)" d="M472 120 H528"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="li-title">
  <title id="li-title">Loop invariant: establishment, preservation, exit</title>
  <defs>
    <marker id="li-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .step { font-size: 13px; fill: #334155; }
    .step-title { font-size: 14px; font-weight: 700; }
    .tag { font-size: 12px; font-weight: 600; fill: #16a34a; }
  </style>
  <rect x="32" y="48" width="160" height="144" rx="10" fill="#eff6ff" stroke="#3b6fd9" stroke-width="2"/>
  <text class="step-title" x="112" y="80" text-anchor="middle" fill="#1e40af">Entry</text>
  <text class="step" x="112" y="108" text-anchor="middle">Invariant I</text>
  <text class="step" x="112" y="128" text-anchor="middle">must hold</text>
  <text class="tag" x="112" y="168" text-anchor="middle">establishment</text>
  <rect x="248" y="48" width="224" height="144" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text class="tag" x="360" y="72" text-anchor="middle">preservation</text>
  <text class="step-title" x="360" y="100" text-anchor="middle" fill="#312e81">One iteration</text>
  <text class="step" x="360" y="124" text-anchor="middle">Assume I and cond</text>
  <text class="step" x="360" y="144" text-anchor="middle">Run body; prove I again</text>
  <rect x="528" y="48" width="160" height="144" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="step-title" x="608" y="80" text-anchor="middle" fill="#14532d">Exit</text>
  <text class="step" x="608" y="108" text-anchor="middle">I and not cond</text>
  <text class="step" x="608" y="128" text-anchor="middle">useful fact</text>
  <text class="tag" x="608" y="168" text-anchor="middle">exit condition</text>
  <path d="M192 120 H248" stroke="#64748b" stroke-width="2" marker-end="url(#li-arrow)"/>
  <path d="M472 120 H528" stroke="#64748b" stroke-width="2" marker-end="url(#li-arrow)"/>
</svg>
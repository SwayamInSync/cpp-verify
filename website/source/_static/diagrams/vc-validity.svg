<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="vc-title">
  <title id="vc-title">Verification condition: prove Hypothesis implies Goal via UNSAT</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caption { font-size: 13px; fill: #475569; }
    .box-h { font-size: 14px; font-weight: 700; fill: #1e40af; }
    .box-g { font-size: 14px; font-weight: 700; fill: #14532d; }
    .detail { font-size: 12px; fill: #334155; }
    .foot { font-size: 12px; fill: #475569; }
  </style>
  <text class="caption" x="360" y="28" text-anchor="middle">Prove: Hypothesis ⇒ Goal</text>
  <rect x="48" y="48" width="220" height="100" rx="8" fill="#eff6ff" stroke="#3b6fd9" stroke-width="2"/>
  <text class="box-h" x="68" y="76">Hypothesis</text>
  <text class="detail" x="68" y="98">pre, path facts, invariants</text>
  <text x="300" y="102" text-anchor="middle" font-size="24" fill="#64748b">⇒</text>
  <rect x="360" y="48" width="220" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="box-g" x="380" y="76">Goal (post)</text>
  <text class="detail" x="380" y="108">Q</text>
  <rect x="48" y="162" width="624" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="foot" x="360" y="184" text-anchor="middle">CppVerify: UNSAT( Hypothesis ∧ ¬Goal )</text>
  <text class="foot" x="360" y="202" text-anchor="middle">No satisfying model ⇒ implication holds in the theory</text>
</svg>
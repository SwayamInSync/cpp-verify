<svg xmlns="http://www.w3.org/2000/svg" width="100%" aria-labelledby="ht-title" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 720 200"><title id="ht-title">Hoare triple: precondition, statement, postcondition</title><style>text{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif}.caption{font-size:13px;fill:#475569}.label{font-size:15px;font-weight:600}.mono{font-family:ui-monospace,&quot;Cascadia Code&quot;,monospace;font-size:16px}</style><text x="360" y="28" class="caption" text-anchor="middle">If P holds before S runs, then Q holds after S (when S terminates)</text><rect width="130" height="72" x="40" y="56" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/><text x="72" y="102" fill="#92400e" class="mono">{ P }</text><text x="200" y="98" fill="#64748b" font-size="20" text-anchor="middle">→</text><rect width="200" height="88" x="230" y="48" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" rx="8"/><text x="260" y="88" fill="#312e81" class="label">Statement S</text><text x="260" y="110" fill="#64748b" class="caption">your code</text><text x="450" y="98" fill="#64748b" font-size="20" text-anchor="middle">→</text><rect width="130" height="72" x="480" y="56" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/><text x="512" y="102" fill="#14532d" class="mono">{ Q }</text><text x="360" y="178" class="caption" text-anchor="middle">Hoare triple: { P } S { Q }</text></svg>
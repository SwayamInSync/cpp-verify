<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="cw-title">
  <title id="cw-title">Clang AST feeds parallel verify and compile paths</title>
  <defs>
    <marker id="cw-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .title { font-size: 14px; font-weight: 700; }
    .sub { font-size: 11px; fill: #64748b; }
  </style>
  <rect x="24" y="88" width="96" height="64" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="72" y="116" text-anchor="middle">.cpp +</text>
  <text x="72" y="134" text-anchor="middle">contracts</text>
  <rect x="144" y="72" width="112" height="96" rx="8" fill="#dbeafe" stroke="#3b6fd9" stroke-width="2"/>
  <text class="title" x="200" y="108" text-anchor="middle" fill="#1e40af">Clang</text>
  <text x="200" y="128" text-anchor="middle">parse + Sema</text>
  <text class="sub" x="200" y="148" text-anchor="middle">-fverify-contracts</text>
  <rect x="280" y="48" width="200" height="128" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="title" x="380" y="84" text-anchor="middle" fill="#92400e">Verify path</text>
  <text x="380" y="108" text-anchor="middle">VCR → Passive → WP</text>
  <text x="380" y="128" text-anchor="middle">→ Z3 → diagnostics</text>
  <text class="sub" x="380" y="152" text-anchor="middle">cpp-verify / -fverify-contracts</text>
  <rect x="504" y="48" width="192" height="128" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="title" x="600" y="84" text-anchor="middle" fill="#14532d">Compile path</text>
  <text x="600" y="108" text-anchor="middle">CodeGen strips ghost</text>
  <text x="600" y="128" text-anchor="middle">and contract nodes</text>
  <text class="sub" x="600" y="152" text-anchor="middle">runs parallel with verify</text>
  <path d="M120 120 H144 M256 120 H280 M480 104 H504 M480 136 H504" stroke="#94a3b8" stroke-width="2" marker-end="url(#cw-arrow)"/>
  <text x="360" y="210" text-anchor="middle" class="sub">Same AST; verify reads contracts, codegen emits LLVM without ghost code</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" aria-labelledby="mv-title" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 720 300"><title id="mv-title">Modular verification: caller proves callee pre and assumes post</title><defs><marker id="mv-arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#64748b" d="M0,0 L7,3 L0,6 Z"/></marker></defs><style>text{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;font-size:13px;fill:#334155}.title{font-size:14px;font-weight:700;fill:#0f172a}.chip{font-size:12px;font-weight:600}</style><rect width="280" height="252" x="32" y="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="10"/><text x="52" y="52" class="title">Caller (main)</text><text x="52" y="80">1. Prove callee.pre at call site</text><text x="52" y="102">2. Call f()</text><text x="52" y="124">3. Assume callee.post after return</text><rect width="240" height="40" x="52" y="148" fill="#fef3c7" stroke="#d97706" rx="6"/><text x="64" y="174" fill="#92400e" class="chip">VC: pre_main ⇒ post_main</text><rect width="280" height="252" x="408" y="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="10"/><text x="428" y="52" fill="#14532d" class="title">Callee (f)</text><text x="428" y="72" fill="#64748b">Body not needed at call site</text><rect width="240" height="32" x="428" y="88" fill="#fef3c7" stroke="#d97706" rx="6"/><text x="440" y="110" fill="#92400e" class="chip">pre: P</text><rect width="240" height="56" x="428" y="128" fill="#e0e7ff" stroke="#4f46e5" rx="6"/><text x="440" y="152" fill="#312e81">body (hidden)</text><text x="440" y="172" fill="#64748b">proved separately</text><rect width="240" height="32" x="428" y="192" fill="#dcfce7" stroke="#16a34a" rx="6"/><text x="440" y="214" fill="#14532d" class="chip">post: Q</text><rect width="240" height="32" x="428" y="232" fill="#fef3c7" stroke="#d97706" rx="6"/><text x="440" y="254" fill="#92400e" class="chip">VC: P ⇒ Q</text><path stroke="#64748b" stroke-width="2" marker-end="url(#mv-arrow)" d="M312 150 H408"/><text x="360" y="138" fill="#64748b" font-size="12" text-anchor="middle">contract</text></svg>
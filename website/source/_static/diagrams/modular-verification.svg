<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mv-title">
  <title id="mv-title">Modular verification: caller proves callee pre and assumes post</title>
  <defs>
    <marker id="mv-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .chip { font-size: 12px; font-weight: 600; }
  </style>
  <rect x="32" y="24" width="280" height="252" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="title" x="52" y="52">Caller (main)</text>
  <text x="52" y="80">1. Prove callee.pre at call site</text>
  <text x="52" y="102">2. Call f()</text>
  <text x="52" y="124">3. Assume callee.post after return</text>
  <rect x="52" y="148" width="240" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text class="chip" x="64" y="174" fill="#92400e">VC: pre_main ⇒ post_main</text>
  <rect x="408" y="24" width="280" height="252" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text class="title" x="428" y="52" fill="#14532d">Callee (f)</text>
  <text x="428" y="72" fill="#64748b">Body not needed at call site</text>
  <rect x="428" y="88" width="240" height="32" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text class="chip" x="440" y="110" fill="#92400e">pre: P</text>
  <rect x="428" y="128" width="240" height="56" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="440" y="152" fill="#312e81">body (hidden)</text>
  <text x="440" y="172" fill="#64748b">proved separately</text>
  <rect x="428" y="192" width="240" height="32" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text class="chip" x="440" y="214" fill="#14532d">post: Q</text>
  <rect x="428" y="232" width="240" height="32" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text class="chip" x="440" y="254" fill="#92400e">VC: P ⇒ Q</text>
  <path d="M312 150 H408" stroke="#64748b" stroke-width="2" marker-end="url(#mv-arrow)"/>
  <text x="360" y="138" text-anchor="middle" fill="#64748b" font-size="12">contract</text>
</svg>
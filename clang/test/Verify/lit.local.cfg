import lit.util

# Z3 queries are memory- and CPU-intensive. Avoid oversubscribing the host so
# per-query timeouts remain deterministic under the full Clang test runner.
core_count = lit.util.usable_core_count()
lit_config.parallelism_groups["cppverify"] = min(2, core_count)
config.parallelism_group = "cppverify"

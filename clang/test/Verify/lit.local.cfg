import lit.util

# Z3 queries are memory- and CPU-intensive. Avoid oversubscribing the host so
# per-query timeouts remain deterministic under the full Clang test runner.
core_count = lit.util.usable_core_count()
lit_config.parallelism_groups["cppverify"] = min(2, core_count)
config.parallelism_group = "cppverify"

# A test whose verdicts rest on a 64-bit long, or on the names of the Itanium
# ABI, names its target: the verifier models the target it is given, and on
# Windows long has 32 bits.
config.substitutions.append(("%linux_target", "--target=x86_64-unknown-linux-gnu"))
config.substitutions.append(("%windows_target", "--target=x86_64-pc-windows-msvc"))

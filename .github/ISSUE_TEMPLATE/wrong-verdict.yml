name: Wrong verdict
description: Verified for a claim that is false, or a counterexample that does not break the claim.
body:
  - type: markdown
    attributes:
      value: |
        A wrong verdict is the most serious bug a verifier can have. If it could be used to slip a defect past verification on purpose, report it privately instead (see SECURITY.md).
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The smallest C++ file that shows it, with its contracts.
      render: cpp
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: cpp-verify file.cpp
    validations:
      required: true
  - type: textarea
    id: verdict
    attributes:
      label: What cpp-verify says, and why it is wrong
      description: The verdict, and an execution (inputs and the values they lead to) that shows the claim is false, or why the counterexample does not break it.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: cpp-verify --version
      render: text
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: Output with --diagnostics-format=json
      render: text

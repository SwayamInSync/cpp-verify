name: CppVerify differential execution

# Every night, each differential case (clang/utils/cppverify-differential) is
# verified in every configuration it lists and run natively under UBSan on its
# inputs. The job fails when a verdict and the execution disagree.

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CVC5_VERSION: "1.4.2"

jobs:
  differential:
    name: Differential execution
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPRESS: "1"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools and cvc5
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache
          curl -sSfL -o "$RUNNER_TEMP/cvc5.zip" \
            "https://github.com/cvc5/cvc5/releases/download/cvc5-$CVC5_VERSION/cvc5-Linux-x86_64-static.zip"
          unzip -q "$RUNNER_TEMP/cvc5.zip" -d "$RUNNER_TEMP/cvc5"
          dirname "$(find "$RUNNER_TEMP/cvc5" -name cvc5 -type f)" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-release-${{ github.sha }}
          restore-keys: ccache-linux-release-

      - name: Configure
        run: |
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=Native \
            -DCPPVERIFY_VENDOR_Z3=ON \
            -DCPPVERIFY_PREFER_SYSTEM_Z3=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_CCACHE_BUILD=ON

      - name: Build
        run: ninja -C build clang cpp-verify

      - name: Report the versions
        run: |
          build/bin/cpp-verify --version
          cvc5 --version | head -1

      - name: Run the differential cases
        run: |
          python3 clang/utils/cppverify-differential/run.py \
            --cpp-verify build/bin/cpp-verify --jobs "$(nproc)" \
            --work "$RUNNER_TEMP/differential" --report differential.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-report
          path: differential.json
